[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "trendsys"
version = "0.0.1"
description = "Versioned price data and signal research for TrendSystem"
requires-python = ">=3.9"
dependencies = [
    "pandas",
    "pyarrow",
    "pyyaml",
    "openpyxl",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["trendsys*"]
