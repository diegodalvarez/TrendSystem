# TrendSystem data sources
# -----------------------------------------------------------------------------
# This is the ONLY file where machine-specific absolute paths live.
# Edit it by hand.
#
# Filled in 2026-11-08 from every path hardcoded in src/DataPrep/*.py.
# Names are suggestions - rename, merge or delete entries freely.
#
# Fields per source:
#   root      absolute path to the folder (single quotes keep the backslashes)
#   group     batch name used by the spider's test settings below:
#             adhoc, bbgdata, weekly, yahoo, old_data, firstrate, other
#   vendor   who the data came from: bbg, yahoo, thetadata, cboe, firstratedata, other
#   category  price      -> prices / returns (current focus)
#             non_price  -> spreads, correlations, positioning, fundamentals
#   mode      full        -> spider also reads file structure only
#                            (columns, row counts, date ranges, tickers; never price values)
#             names_only  -> spider records names, sizes, dates only
#             (both modes list the file names inside .zip files; nothing is extracted)
#   include   optional glob patterns (relative to root) to limit a crawl
#   exclude   optional glob patterns to skip
#   holds     what is in it, as far as the code shows
#   files     files the current code reads from it (others may exist)
#   used_by   script.method that reads it today
#   notes     anything odd found while reading the code
#
# Leave `root: ''` to switch an entry off.
# -----------------------------------------------------------------------------

paths:
  # Relative to the repo root unless absolute.
  data_root: data           # the new versioned store (built from scratch)
  catalog:   data/catalog   # registry.xlsx, inventories, manifests (tracked in git)
  old_data:  old_data       # GUIDE ONLY: never a data source; will be deleted

# -----------------------------------------------------------------------------
# Spider test settings - edit these to work through the sources step by step.
# Command-line options override them (see the top of scripts/spider_sources.py).
# -----------------------------------------------------------------------------

spider:
  # Which groups to crawl. [] = every source that has a root.
  groups: [adhoc, bbgdata, old_data, firstrate]

  # How many files per source get OPENED (zip contents / file structure).
  # File names, sizes and dates are always listed for every file - that is fast
  # and reads nothing. 0 = no limit (open every file).
  max_files_per_source: 0

  # Which files are picked when there is a limit:
  #   spread -> spread across the folder and across file types; raising the
  #             limit later keeps the files already picked and adds more
  #   first  -> the first N in alphabetical order
  sample: spread

sources:

  # ===========================================================================
  # Bloomberg - A:\2026BlpAdHocData\Combined  (main ad hoc pulls)
  # ===========================================================================

  bbg_adhoc_futures:
    root: 'A:\2026BlpAdHocData\Combined\Futures'
    group: adhoc
    vendor: bbg
    category: price
    mode: full
    include: []
    exclude: ['FX/**']      # FX subfolder is its own entry below
    holds: 'Generic front-month futures prices, one parquet per exchange, plus leftover roots in Excel'
    files:
      - '1*Px.parquet  (one per exchange, e.g. 1CboeFuturesExchangePx, 1NewYorkMercantileExchangePx, 1OsakaExchangePx)'
      - 'LeftOverFutures.xlsx  (one sheet per root ticker; Date, Last Px)'
    used_by:
      - FuturesDataCollect.get_raw_fut_px        # fut_path and extra_path both point here
      - FuturesDataCollect._get_left_over_futures
    notes: >
      Three layouts in one folder: the CBOE file is long (date, security, PX_LAST);
      NYMEX and Osaka are long by field (date, ticker, field, value) and get pivoted;
      the rest are read as-is. EO1 Index is dropped. Volume1.parquet also lives here
      (read by the Kurth whitepaper notebook, not by DataPrep).

  bbg_adhoc_futures_fx:
    root: 'A:\2026BlpAdHocData\Combined\Futures\FX'
    group: adhoc
    vendor: bbg
    category: price
    mode: full
    include: []
    exclude: []
    holds: 'FX futures prices and FX spot rates (Excel)'
    files:
      - 'FXFutures.xlsx  (sheet PX_LAST, wide, headers like "XX1 COMB Curncy (desc)")'
      - 'FX.xlsx  (wide spot FX, headers like "EURUSD BGN Curncy (desc)")'
    used_by:
      - FuturesDataCollect._get_extra_fx_fut
      - FuturesDataCollect.prep_fut_px -> _get_fx1
    notes: >
      EquityIndices reads its FX.xlsx from WeekyNotebooks\20260705TmpFutures\FX instead
      (entry bbg_wn_20260705_fx). Check whether the two FX.xlsx files are the same.

  bbg_adhoc_px:
    root: 'A:\2026BlpAdHocData\Combined\PX'
    group: adhoc
    vendor: bbg
    category: price         # mixed: also holds non-price files, see holds
    mode: full
    include: []
    exclude: []
    holds: >
      Long-format parquet per dataset: trend indices (price), CDS series (price + spread),
      implied/realized correlation (non-price), CFTC positioning (non-price)
    files:
      - 'Barclays, BloombergTrend, BNP, BofA, CITI1, CommodTrend, DBTrend, TrendIndices  (.parquet; trend indices, tickers from TrendIndicesGuide.xlsx)'
      - '<File>.parquet for credit rows with Source == source2 in TickerGuide.xlsx sheet credit  (CDS)'
      - 'EquityImpliedCorrelation.parquet, EquityRealizedCorrelation.parquet'
      - '<File>.parquet named in ImpliedCorrelationTickerGuide.xlsx sheet CBOEGuide  (CBOE implied correlation)'
      - 'CFTCData.parquet'
    used_by:
      - TrendIndicesPrep.get_raw_trend_indices
      - CreditIndices.collect_raw_cds_data       # source2
      - ImpliedCorrelationPrep.get_raw_cboe_corr
      - ImpliedCorrelationPrep.get_raw_bloomberg_corr
      - FuturesDataCollect.get_cftc
    notes: >
      Notebooks also read hf_indices.parquet and EquityIndices.parquet from here.
      Barclays.parquet uses Date/variable/value; most others use date/security/... .
      CBOE correlation values are stored x100 and divided by 100 on read.

