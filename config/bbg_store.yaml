# Bloomberg -> price store (step 2.1)
# -----------------------------------------------------------------------------
# Used by scripts/build_bbg_store.py. Edit by hand.
#
# Each origin file becomes one stored series PER TICKER, in
#   data/store/bbg/<dataset>/1day/<TICKER>/<origin_key>/v0001/data.parquet + manifest.json
# Nothing is merged across files (each pull may be back-adjusted differently).
#
# Per origin:
#   source           name from config/sources.yaml (gives the folder)
#   file             file name or glob; the first entry that matches a file wins
#   include          true / false
#   dataset          fut_generic | fut_contract | fx_spot | fx_future | index_px
#                    in fut_generic files, tickers that look like generics (ES1 Index,
#                    C 2 Comdty) get their root and generic number recorded; other
#                    files are not searched (detect_generics: true to force it)
#   reader           auto (from the columns) | long_by_field | melted | melted_single |
#                    wide_fields | excel_sheet_field | excel_sheet_ticker | excel_wide
#   ticker / field_column / date / value   force column roles if auto gets them wrong
#   field            fixed field for files without a field column (default PX_LAST)
#   ticker_map       Excel sheet name -> ticker (excel_sheet_ticker)
#   note             free text
# -----------------------------------------------------------------------------

# Run options (dry run, only, force) are at the top of scripts/build_bbg_store.py.

store: data/store/bbg
log_dir: data/store/_logs

